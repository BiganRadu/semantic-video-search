<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The mark from components/Logo.tsx, reduced for tab size: a playhead and the
    frame it cues.

    The logo's filmstrip perforations are deliberately not here. They were, and
    at 16px - which is where a favicon actually lives - they smeared into the
    playhead and the whole thing read as a smudge. Two bold shapes survive the
    downscale; five small ones do not.

    The tile is painted rather than transparent for the same reason: these
    accent colours are chosen against the app's dark background, and a
    transparent icon would take its contrast from whatever the browser chrome
    happens to be.
  -->
  <defs>
    <linearGradient id="c" x1="8" y1="6" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7aa2ff"/>
      <stop offset="1" stop-color="#a97bff"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="#0b0d12"/>
  <path d="M10.8 5.8v20.4" stroke="url(#c)" stroke-width="3.1" stroke-linecap="round"/>
  <path d="M16.4 9.4v13.2l9.2-6.6-9.2-6.6Z" fill="url(#c)"/>
</svg>
